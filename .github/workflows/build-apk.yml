name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Decode keystore
        run: echo "${{ secrets.VAULT_KEYSTORE_BASE64 }}" | base64 -d > vault-release.jks
      - run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          VAULT_KEYSTORE_PASSWORD: ${{ secrets.VAULT_KEYSTORE_PASSWORD }}
          VAULT_KEY_ALIAS: ${{ secrets.VAULT_KEY_ALIAS }}
          VAULT_KEY_PASSWORD: ${{ secrets.VAULT_KEY_PASSWORD }}
          VAULT_KEYSTORE_FILE: ${{ github.workspace }}/vault-release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: Vault-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
